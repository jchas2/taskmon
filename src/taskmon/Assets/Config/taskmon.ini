;=============================================================================
; Task Monitor (taskmon) - taskmon.ini
;=============================================================================
; This file can be edited by hand. Lines starting with ; or # are comments.
; Saving from Setup (F2) changes only the settings changed there, so your
; comments, blank lines and ordering are kept. Settings added by a newer
; version are added to the end of their section, with their comment, the next
; time taskmon starts.
; If this file can't be read, taskmon starts with its defaults and leaves the
; file alone. Every setting below shows its default value.
;=============================================================================

[ux]
; Ask before ending a task. True or False.
confirm-task-delete=True

; The theme to use: a built-in theme, or the [header] name of one of your own
; in the themes folder. F3 switches theme for the current session only.
default-theme=Taskmon Default

; The SUMMARY layout to use: a built-in layout, or the [header] name of one of
; your own in the layouts folder. F4 switches layout for the current session.
default-summary-layout=Taskmon Essentials 1

; Highlight daemons (macOS) or Windows services in the process list.
highlight-daemons=True

; Briefly highlight a value in the process list when it changes.
highlight-stats-col-update=True

; How metres are drawn: Blocks, Bars or Dots.
metre-style=Dots

; Show check boxes in the process list, so several processes can be selected
; at once.
multi-select-procs=False

; Show each SUMMARY chart's current reading as text in its label.
show-metre-cpu-numerically=True
show-metre-disk-numerically=True
show-metre-gpu-numerically=True
show-metre-mem-numerically=True
show-metre-gpu-mem-numerically=True
show-metre-network-numerically=True
; Neural Engine chart (macOS).
show-metre-npu-numerically=True
; Virtual memory chart on Windows, swap chart on macOS.
show-metre-swap-numerically=True

; Draw a grid behind small charts (CPU cores, Performance panels) and large
; charts.
show-small-metre-grid=False
show-large-metre-grid=False

; Show tips in the footer.
show-tips=True

; Show the scale on chart Y axes.
show-y-axis-scale=True

; The language of taskmon's screens, as a code such as en-GB, en-US, de, fr or
; it-IT. Empty uses your system's language. The TASKMON_UI_LANGUAGE
; environment variable overrides this for a single session.
ui-language=

; How per-process CPU% is shown. True (Irix mode): a process using one whole
; core shows 100%, so a busy process can show more than 100%. False (Solaris
; mode): shown as a share of all cores, so the total never exceeds 100%. The
; default is False on Windows and True on macOS, as Activity Monitor shows it.
use-irix-cpu-reporting=False

[stats]
; The PROCESSES view's columns, comma separated, from: Process, Pid, User,
; Pri, Cpu, Thrd, Gpu, Mem, Path, Disk, Power, AvgCpu, AvgGpu, AvgMem, AvgDisk,
; MaxCpu, MaxGpu, MaxMem and MaxDisk. Process and Pid are always shown. A
; process list on SUMMARY takes its columns from the layout instead.
cols=Process, Pid, User, Pri, Cpu, Thrd, Gpu, Mem, Path, Disk

; Milliseconds between updates. Values under 500 are treated as 500. The
; command line option -d or --delay overrides it.
delay=1500

[sort]
; The column the PROCESSES view is sorted by, one of the column names above.
; A process list on SUMMARY takes its sort from the layout instead.
col=Cpu

; True sorts lowest first, False highest first.
asc=False

[filter]
; Show only matching processes. Only one filter applies: pid if set, then
; username, then process. The command line options --pid, -u and -p set them
; for a session, and saving from Setup in that session keeps them here.

; A process ID, or -1 for no filter.
pid=-1

; Part of a user name, matched ignoring case. Empty for no filter.
username=

; Part of a process name, matched ignoring case. Empty for no filter.
process=

[health]
; Thresholds for the HEALTH view, as whole numbers. Changes take effect the
; next time taskmon starts. A value that isn't usable, or a warning and
; critical pair the wrong way round, falls back to its default. The README
; describes each setting in more detail.

; ---- How long before a status changes ----
; A resource turns Warning or Critical only after staying over its threshold
; for the sustain period, so a short spike doesn't raise a status.
warning-sustain-seconds=30
critical-sustain-seconds=60

; How long in total a value can spend back on the safe side of a threshold
; before the sustain or clear period starts again.
sustain-grace-seconds=5

; How long a value must stay back under a threshold before the status clears.
clear-seconds=30

; How many recent events to keep, in the HEALTH view and on disk. 0 turns
; saving them off.
event-history-size=100

; ---- CPU ----
; CPU busy time, as a percentage.
cpu-warning-percent=90
cpu-critical-percent=98

; Threads waiting per core (Windows), or load average per core (macOS).
run-queue-warning-per-core=2

; The run queue only counts while the CPU is at least this busy, as the macOS
; load average keeps falling for over a minute after work ends.
run-queue-busy-percent=50

; CPU time spent in drivers, as DPC and interrupt time (Windows).
driver-time-warning-percent=15

; The share of normal CPU performance the machine is allowed (Windows). It
; falls when heat, power or a battery setting holds the CPU back.
performance-limit-warning-percent=80

; ---- Memory ----
; Memory available, as a percentage (Windows). macOS uses the kernel's own
; memory pressure level instead.
memory-available-warning-percent=10
memory-available-critical-percent=5

; Commit charge against the commit limit, as a percentage (Windows).
commit-warning-percent=90
commit-critical-percent=97

; Pages read from disk per second to resolve hard faults (Windows).
hard-faults-warning-per-second=500

; Hard faults only count with this much memory available or less, as Windows
; also reads pages back in when memory is plentiful.
hard-faults-available-percent=25

; Swap-out rate in MB per second that counts as a warning (macOS). 0 means any
; swapping out.
swap-out-warning-mb-per-second=0

; Memory free on the fullest GPU, as a percentage: a discrete card's own
; VRAM, or an integrated GPU's dedicated and shared memory together.
gpu-memory-free-warning-percent=10

; ---- Disks and volumes ----
; Time for a disk transfer on the slowest disk, in milliseconds.
disk-latency-warning-ms=20
disk-latency-critical-ms=100

; Disk active time, as a percentage. Used only when latency can't be read.
disk-active-warning-percent=90

; Free space on a volume, as a percentage. Read-only volumes are ignored.
volume-free-warning-percent=10
volume-free-critical-percent=5

; Free space on the system volume in GB, whatever its size.
system-volume-free-critical-gb=2

; How much of an NVMe drive's rated life is used, as a percentage (Windows).
; A drive reporting a critical warning is always Critical.
nvme-wear-warning-percent=90

; ---- Temperature ----
; How close a sensor may come to its critical limit, in degrees Celsius, for
; sensors that report one.
sensor-warning-margin-celsius=10
sensor-critical-margin-celsius=3

; Thermal pressure level (macOS): Nominal, Moderate, Heavy, Trapping or
; Sleeping.
thermal-pressure-warning=Moderate
thermal-pressure-critical=Heavy

; ---- Applications ----
; How long a window has been not responding, in seconds (Windows). Windows
; takes about 5 seconds to call a window hung, and this counts from there.
not-responding-warning-seconds=5
not-responding-critical-seconds=30

; How many hours back to list crashes, hangs and hardware errors the system
; recorded. They appear under Recent events and never change a status.
report-lookback-hours=24
