ShortDescription: A powerful, cross-platform terminal-based task monitor.
Description: >-
  Task Monitor (taskmon) is a powerful, cross-platform terminal-based task monitor that
  provides real-time monitoring and management of system performance, active processes,
  and resource utilization. Inspired by tools like top, htop and the Windows Task Manager.
  It installs a self-contained, natively compiled (AOT) single-file executable and
  automatically selects the x64 or ARM64 build to match your machine. taskmon does not
  require elevated permission for system monitoring, however some system process detail
  won't be available unless run as Administrator.
