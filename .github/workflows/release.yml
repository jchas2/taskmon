name: Release

# git tag -a vN.N.N -m "Release vN.N.N"        
# git push origin vN.N.N 
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag or input
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          release_name: Release v${{ steps.get-version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Release v${{ steps.get-version.outputs.version }}

            ### Installation

            **macOS (Homebrew):**
            ```bash
            brew tap jchas2/taskmon
            brew install taskmon
            ```

            **Direct Download:**
            Download the appropriate binary for your platform below.

            ### Checksums
            SHA256 checksums are provided for each artifact.

  build-macos:
    name: Build macOS (ARM64)
    needs: create-release
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish
        run: |
          chmod +x ./eng/build.sh
          ./eng/build.sh --restore --publish --config Release --runtime osx-arm64

      - name: Create archive
        run: |
          cd src/taskmon/bin/Release/net10.0/osx-arm64/publish
          tar -czf taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz taskmon
          shasum -a 256 taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz > taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz.sha256

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: src/taskmon/bin/Release/net10.0/osx-arm64/publish/taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz
          asset_name: taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz
          asset_content_type: application/gzip

      - name: Upload Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: src/taskmon/bin/Release/net10.0/osx-arm64/publish/taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz.sha256
          asset_name: taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz.sha256
          asset_content_type: text/plain

      - name: Save artifact for Homebrew
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-binary
          path: src/taskmon/bin/Release/net10.0/osx-arm64/publish/taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish
        run: |
          ./eng/build.ps1 -restore -publish -config Release -runtime win-x64

      - name: Create archive
        shell: pwsh
        run: |
          cd src/taskmon/bin/Release/net10.0/win-x64/publish
          Compress-Archive -Path taskmon.exe -DestinationPath taskmon-${{ needs.create-release.outputs.version }}-windows-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 taskmon-${{ needs.create-release.outputs.version }}-windows-x64.zip).Hash
          "$hash  taskmon-${{ needs.create-release.outputs.version }}-windows-x64.zip" | Out-File -FilePath taskmon-${{ needs.create-release.outputs.version }}-windows-x64.zip.sha256 -Encoding ASCII

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: src/taskmon/bin/Release/net10.0/win-x64/publish/taskmon-${{ needs.create-release.outputs.version }}-windows-x64.zip
          asset_name: taskmon-${{ needs.create-release.outputs.version }}-windows-x64.zip
          asset_content_type: application/zip

      - name: Upload Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: src/taskmon/bin/Release/net10.0/win-x64/publish/taskmon-${{ needs.create-release.outputs.version }}-windows-x64.zip.sha256
          asset_name: taskmon-${{ needs.create-release.outputs.version }}-windows-x64.zip.sha256
          asset_content_type: text/plain

  update-homebrew:
    name: Update Homebrew Formula
    needs: [create-release, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-binary

      - name: Calculate SHA256
        id: sha
        run: |
          SHA256=$(shasum -a 256 taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz | cut -d ' ' -f 1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: jchas2/homebrew-taskmon
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          cd homebrew-tap
          cat > Formula/taskmon.rb << 'EOF'
          class taskmon < Formula
            desc "Task Monitor for the command line"
            homepage "https://github.com/jchas2/taskmon-cli"
            version "${{ needs.create-release.outputs.version }}"

            url "https://github.com/jchas2/taskmon-cli/releases/download/v#{version}/taskmon-#{version}-macos-arm64.tar.gz"
            sha256 "${{ steps.sha.outputs.sha256 }}"

            def install
              bin.install "taskmon"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/taskmon --version")
            end
          end
          EOF

      - name: Commit and Push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/taskmon.rb
          git commit -m "Update taskmon to ${{ needs.create-release.outputs.version }}"
          git push
