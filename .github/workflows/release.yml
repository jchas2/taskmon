name: Release

# git tag -a vN.N.N -m "Release vN.N.N"        
# git push origin vN.N.N 
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag or input
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          release_name: Release v${{ steps.get-version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Release v${{ steps.get-version.outputs.version }}

            ### Installation

            **macOS (Homebrew):**
            ```bash
            brew tap jchas2/taskmon
            brew install taskmon
            ```

            **Windows (Chocolatey):**
            ```powershell
            choco install taskmon
            ```

            **Windows (winget):**
            ```powershell
            winget install jchas2.taskmon
            ```

            **Direct Download:**
            Download the appropriate binary for your platform below (Windows x64 and ARM64 available).

            ### Checksums
            SHA256 checksums are provided for each artifact.

  build-macos:
    name: Build macOS (ARM64)
    needs: create-release
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish
        run: |
          chmod +x ./eng/build.sh
          ./eng/build.sh --restore --publish --config Release --runtime osx-arm64

      - name: Create archive
        run: |
          cd src/taskmon/bin/Release/net10.0/osx-arm64/publish
          tar -czf taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz taskmon
          shasum -a 256 taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz > taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz.sha256

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: src/taskmon/bin/Release/net10.0/osx-arm64/publish/taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz
          asset_name: taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz
          asset_content_type: application/gzip

      - name: Upload Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: src/taskmon/bin/Release/net10.0/osx-arm64/publish/taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz.sha256
          asset_name: taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz.sha256
          asset_content_type: text/plain

      - name: Save artifact for Homebrew
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-binary
          path: src/taskmon/bin/Release/net10.0/osx-arm64/publish/taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            runner: windows-latest
          - arch: arm64
            rid: win-arm64
            runner: windows-11-arm
    env:
      RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish
        run: |
          ./eng/build.ps1 -restore -publish -config Release -runtime ${{ matrix.rid }}

      - name: Create archive
        shell: pwsh
        run: |
          $zip = "taskmon-${{ needs.create-release.outputs.version }}-windows-${{ matrix.arch }}.zip"
          cd src/taskmon/bin/Release/net10.0/${{ matrix.rid }}/publish
          Compress-Archive -Path taskmon.exe -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ASCII

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: src/taskmon/bin/Release/net10.0/${{ matrix.rid }}/publish/taskmon-${{ needs.create-release.outputs.version }}-windows-${{ matrix.arch }}.zip
          asset_name: taskmon-${{ needs.create-release.outputs.version }}-windows-${{ matrix.arch }}.zip
          asset_content_type: application/zip

      - name: Upload Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: src/taskmon/bin/Release/net10.0/${{ matrix.rid }}/publish/taskmon-${{ needs.create-release.outputs.version }}-windows-${{ matrix.arch }}.zip.sha256
          asset_name: taskmon-${{ needs.create-release.outputs.version }}-windows-${{ matrix.arch }}.zip.sha256
          asset_content_type: text/plain

      - name: Save artifact for Chocolatey1
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-binary
          path: src/taskmon/bin/Release/net10.0/${{ matrix.rid }}/publish/taskmon-${{ needs.create-release.outputs.version }}-windows-${{ matrix.arch }}.zip

  update-homebrew:
    name: Update Homebrew Formula
    needs: [create-release, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-binary

      - name: Calculate SHA256
        id: sha
        run: |
          SHA256=$(shasum -a 256 taskmon-${{ needs.create-release.outputs.version }}-macos-arm64.tar.gz | cut -d ' ' -f 1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: jchas2/homebrew-taskmon
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          cd homebrew-tap
          cat > Formula/taskmon.rb << 'EOF'
          class Taskmon < Formula
            desc "Task Monitor for the command line"
            homepage "https://github.com/jchas2/taskmon"
            version "${{ needs.create-release.outputs.version }}"

            url "https://github.com/jchas2/taskmon/releases/download/v#{version}/taskmon-#{version}-macos-arm64.tar.gz"
            sha256 "${{ steps.sha.outputs.sha256 }}"

            def install
              bin.install "taskmon"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/taskmon --version")
            end
          end
          EOF

      - name: Commit and Push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/taskmon.rb
          git commit -m "Update taskmon to ${{ needs.create-release.outputs.version }}"
          git push

  publish-chocolatey:
    name: Publish Chocolatey Package
    needs: [create-release, build-windows]
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-binary
          path: artifacts/x64

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-binary
          path: artifacts/arm64

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          ./packaging/choco/build-choco.ps1 `
            -Version $env:VERSION `
            -X64Zip "artifacts/x64/taskmon-$env:VERSION-windows-x64.zip" `
            -Arm64Zip "artifacts/arm64/taskmon-$env:VERSION-windows-arm64.zip"

      - name: Push to Chocolatey Community Repository
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $nupkg = Get-ChildItem packaging/choco/dist/*.nupkg | Select-Object -First 1
          Write-Host "Pushing $($nupkg.Name)"
          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

  publish-winget:
    name: Publish winget Manifest
    needs: [create-release, build-windows]
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-binary
          path: artifacts/x64

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-binary
          path: artifacts/arm64

      - name: Build winget manifests
        shell: pwsh
        run: |
          ./packaging/winget/build-winget.ps1 `
            -Version $env:VERSION `
            -X64Zip "artifacts/x64/taskmon-$env:VERSION-windows-x64.zip" `
            -Arm64Zip "artifacts/arm64/taskmon-$env:VERSION-windows-arm64.zip"

      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # wingetcreate opens a PR against microsoft/winget-pkgs from a fork owned by the
          # WINGET_TOKEN's account. The first version must be bootstrapped manually
          # (see packaging/winget/README.md); subsequent versions are submitted here.
          # Use the standalone exe rather than `winget install` (no interactive app context on runners).
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit packaging/winget/dist --token $env:WINGET_TOKEN
